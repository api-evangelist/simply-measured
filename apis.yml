name: Simply Measured
description: 'Simply Measured was a Seattle-based social media analytics and reporting platform, founded
  in 2010 and backed by Trinity Ventures, that measured brand performance across Twitter, Facebook,
  Instagram, YouTube, LinkedIn and other social channels. It was acquired by Sprout Social in December
  2017 and its product, brand, and developer surface were sunset and folded into Sprout Social. The
  simplymeasured.com domain now 301-redirects to sproutsocial.com and no independent Simply Measured
  API, developer portal, or documentation remains online. This record is retained as a defunct/acquired
  portfolio-lead marker; there is no live API surface to enrich.'
